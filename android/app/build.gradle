plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingProperty = { String name ->
    project.findProperty("safex${name}") ?: keystoreProperties[name]
}

def generatedAssets = layout.buildDirectory.dir("generated/gameAssets")
def nativeProjectDir = rootProject.projectDir.parentFile
def gameProjectDir = nativeProjectDir.parentFile
def safexRoot = System.getenv("SAFEX_ROOT")
if (!safexRoot) {
    throw new GradleException("SAFEX_ROOT is required. Run Gradle through the safex CLI.")
}
def syncGameAssets = tasks.register("syncGameAssets", Sync) {
    from(nativeProjectDir) {
        include "dist/**"
    }
    from(gameProjectDir) {
        include "res/**"
    }
    into(generatedAssets)
}

android {
    namespace "com.safeengine.jssdl"
    compileSdk 37
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.safeengine.jssdl"
        minSdk 21
        targetSdk 37
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                arguments "-DJS_SDL_USE_VENDORED=ON"
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
        }
    }

    signingConfigs {
        release {
            def storeFilePath = signingProperty("StoreFile")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword signingProperty("StorePassword")
                keyAlias signingProperty("KeyAlias")
                keyPassword signingProperty("KeyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (signingProperty("StoreFile")) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.31.6"
        }
    }

    sourceSets {
        main {
            assets.srcDir(generatedAssets.get().asFile)
            java.srcDirs += [
                "$safexRoot/third_party/SDL/android-project/app/src/main/java"
            ]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(syncGameAssets)
}
